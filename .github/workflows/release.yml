# 打 vX.Y.Z 版本 tag 时：
#   - 后端：构建镜像并 docker save 导出为 tar
#   - 前端：vite build，将 dist/ 打成 zip
#   产物同时上传为 workflow artifact，并发布为同名 GitHub Release 的 assets。
# 手动触发（workflow_dispatch）只产出 artifact，不创建 release。
name: Release package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Package backend (docker tar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t cloudshuttle-backend:${GITHUB_REF_NAME} .

      - name: Save image to tar
        run: docker save -o cloudshuttle-backend-${GITHUB_REF_NAME}.tar cloudshuttle-backend:${GITHUB_REF_NAME}

      - uses: actions/upload-artifact@v4
        with:
          name: backend-tar
          path: cloudshuttle-backend-${{ github.ref_name }}.tar
          if-no-files-found: error

  frontend:
    name: Package frontend (zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Zip dist
        working-directory: frontend
        run: python3 -c "import shutil,sys;shutil.make_archive(sys.argv[1],'zip','.')" ../cloudshuttle-web-${GITHUB_REF_NAME}

      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: frontend/cloudshuttle-web-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: [backend, frontend]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CloudShuttle ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-assets/**/*