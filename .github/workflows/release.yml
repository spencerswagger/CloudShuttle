# 触发规则：
#   - main（正式发布）：打 vX.Y.Z（无后缀）生效；guard 会校验该 tag 必须已在 main 上
#   - 其他分支（测试/预发布）：打 vX.Y.Z-后缀（如 v0.1.0-rc1）生效
# 手动触发 workflow_dispatch：只产出 artifact，不建 release、不校验分支。
name: Release package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    name: Validate tag (release on main, prerelease anywhere)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            if (context.refType !== 'tag') { core.info('manual run; skip tag validation'); return; }
            const tag = context.ref.replace('refs/tags/', '');
            if (tag.includes('-')) { core.info(`pre-release tag ${tag}; allowed on any branch`); return; }
            const { data: mainB } = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: 'main' });
            const { data: cmp } = await github.rest.repos.compareCommits({ owner: context.repo.owner, repo: context.repo.repo, base: tag, head: mainB.commit.sha });
            const ok = cmp.status === 'behind' || cmp.status === 'identical';
            if (!ok) core.setFailed(`release tag ${tag} 不在 main 上 (status=${cmp.status})；其他分支请改用带后缀的预发布 tag: ${tag}-rc1`);

  backend:
    name: Package & push backend
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile --build-arg GIT_COMMIT=${GITHUB_SHA::8} -t cloudshuttle-backend:${GITHUB_REF_NAME} .

      - name: Login & push image to registry (tags only)
        if: github.ref_type == 'tag' && env.REGISTRY != '' && env.IMAGE != ''
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE: ${{ secrets.DOCKER_IMAGE }}
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "SKIP: 未配置 DOCKER_USERNAME/DOCKER_PASSWORD，跳过推送"
            exit 0
          fi
          echo "$PASSWORD" | docker login "$REGISTRY" -u "$USERNAME" --password-stdin
          docker tag cloudshuttle-backend:${GITHUB_REF_NAME} "$REGISTRY/$IMAGE:${GITHUB_REF_NAME}"
          docker push "$REGISTRY/$IMAGE:${GITHUB_REF_NAME}"

      - name: Save image tar.gz
        run: docker save cloudshuttle-backend:${GITHUB_REF_NAME} | gzip -9 > cloudshuttle-backend-${GITHUB_REF_NAME}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: backend-tar
          path: cloudshuttle-backend-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  frontend:
    name: Package frontend (zip)
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Zip dist
        working-directory: frontend
        run: |
          cd dist
          python3 -c "import shutil,sys;shutil.make_archive(sys.argv[1],'zip','.')" ../cloudshuttle-web-${GITHUB_REF_NAME}

      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: frontend/cloudshuttle-web-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: [backend, frontend]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CloudShuttle ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist-assets/**/*